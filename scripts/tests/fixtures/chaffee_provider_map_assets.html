<div class="map-asset" asset-post-id="2246" asset-title="Colorado Farm to Table " asset-type="Farm" asset-image="https://chaffeeprovides.org/wp-content/uploads/gravity_forms/3-807d06458b68d91ec29987f0f5c0f413/2021/04/CFTT-Inside-Greenhouse-with-Seedlings.JPG" asset-default-image="http://chaffeeprovides.org/wp-content/uploads/2020/10/field-5-scaled.jpg" asset-description="Get involved growing produce, relationships, and community! 100%  of  the produce grown at Salida’s not for profit Colorado Farm to Table (CFTT) is donated to feed people in need. For 25 years CFTT has been welcoming people of all backgrounds in volunteer farming experiences to grow top quality, nutritious produce for hungry families. Volunteer farm hands work with the farmer manager in 3 hour shifts. No experience is necessary - instruction and tools are provided. Join us!  It’s a lot of fun and a great opportunity to meet and network with some awesome people. CFTT’s sustainable grown produce is distributed to our partner nonprofit food pantries, soup kitchens, low-income housing and feeding programs that redistribute the freshly harvested produce onto the plates of those most in need of nutrition relief. We encourage and welcome new volunteers, distribution partners, and innovative collaborative partnerships. Contact Lisa@coloradofarmtotable.org." asset-address="7750 Co Rd 150, Salida CO 81201 Salida Colorado 81201" asset-hide-address="false" asset-latlng="38.5539557,-106.0198285" asset-phone="(719) 207-2209" asset-email="info@coloradofarmtotable.org" asset-website="http://coloradofarmtotable.org/" asset-offerings="Veggies" ></div>

<div class="map-asset" asset-post-id="2234" asset-title="Rocky Mountain Garlic" asset-type="Farm" asset-image="https://chaffeeprovides.org/wp-content/uploads/gravity_forms/3-807d06458b68d91ec29987f0f5c0f413/2021/04/RMG_sign.jpg" asset-default-image="http://chaffeeprovides.org/wp-content/uploads/2020/10/field-5-scaled.jpg" asset-description="Growing gourmet garlic in Salida, Rocky Mountain Garlic specializes in hard neck Garlic as well as Shallots and Onions. Last season, we experimented with many different root crops and are expanding into other hardy vegetables. We are offering “shares” for purchase! Please contact us for more information and to sign up. We — Mike and Tiffany Collette — grow following organic and biodynamic processes, using an earth-friendly mentality. Our garlic is tended by hand, one clove at a time, on land that is free of chemicals. We place much importance on minimal tillage using mulches, manures, and cover crops in order to hold nutrients and rejuvenate the soil. We use drip irrigation to conserve water and bring to market a unique crop of high desert garlic. From seed to harvest to storage, our garlic is grown for you and good for you. Our mission is to provide fresh and local food, grown by people you can meet face-to-face. It is the heritage of our country and we are proud to continue the tradition!" asset-address="9241 County Road 156 Salida Colorado 81201" asset-hide-address="false" asset-latlng="38.5521859,-106.0108174" asset-phone="(719) 221-6943" asset-email="rockymountaingarlicllc@gmail.com" asset-website="http://rockymountaingarlic.net/" asset-offerings="Spices/Garlic, Veggies, Staples" ></div>
